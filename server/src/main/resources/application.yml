server:
  port: 8080

spring:
  application:
    name: smart-store-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health

smart-store:
  jwt:
    secret: ${JWT_SECRET}
  wechat:
    app-id: ${WECHAT_APP_ID}
    app-secret: ${WECHAT_APP_SECRET}
  upload-dir: ${UPLOAD_DIR}
  rate-limit:
    staff-login:
      limit: 10
      window-seconds: 600
    customer-login:
      limit: 30
      window-seconds: 600
    order-create:
      limit: 10
      window-seconds: 60
